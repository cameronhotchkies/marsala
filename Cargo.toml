[workspace]
members = ["crates/marsala"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "=4.5.57", features = ["derive", "env"] }
config = { version = "=0.15.11", default-features = false, features = ["toml"] }
futures-core = "0.3"
futures-util = "0.3"
flate2 = "1.0"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
rcgen = { version = "=0.14.8", features = ["x509-parser"] }
rustls-pemfile = "=2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webpki-roots = "=1.0.7"
